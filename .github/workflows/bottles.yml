name: Bottles

on:
  push:
    branches: [main]
    paths: ['Formula/etr.rb']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bottles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bottle:
    # Skip bot commits to avoid infinite loops
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[bottles]')
    strategy:
      matrix:
        include:
          # Building a bottle requires bottled dependencies (including go), and
          # Homebrew only bottles for its supported Apple Silicon macOS releases.
          # macos-latest trails the newest macOS, so it stays supported, and its
          # bottle also works on newer macOS. Other systems build from source.
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Tap local repo
        run: |
          tap_dir="$(brew --repository)/Library/Taps/tkjaer/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sf "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Get formula version
        id: formula
        run: |
          version=$(brew info --json=v2 tkjaer/tap/etr | jq -r '.formulae[0].versions.stable')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build bottle
        run: brew install --build-bottle tkjaer/tap/etr

      - name: Create bottle
        run: |
          brew bottle --json \
            --root-url="https://github.com/${{ github.repository }}/releases/download/v${{ steps.formula.outputs.version }}" \
            tkjaer/tap/etr
          ls -la *.bottle*

      - name: Upload bottle artifact
        uses: actions/upload-artifact@v7
        with:
          name: bottle-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/*.bottle*.tar.gz
            ${{ github.workspace }}/*.bottle.json

  publish:
    needs: bottle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          # setup-homebrew replaces the checkout's .git, dropping the credentials
          # actions/checkout stored there. Its token stays configured for the
          # rest of the job, which the bottle PR branch push needs.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all bottles
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Get formula version
        id: formula
        run: |
          version=$(grep -m1 'url ' Formula/etr.rb | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release and upload bottles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.formula.outputs.version }}"
          gh release create "$tag" --title "etr $tag bottles" --notes "Homebrew bottles for etr $tag" 2>/dev/null || true
          # Rename double-dash to single-dash (brew bottle creates --, Homebrew downloads with -)
          for f in *.bottle*.tar.gz; do
            newname="${f/etr--/etr-}"
            [ "$f" != "$newname" ] && mv "$f" "$newname"
          done
          gh release upload "$tag" *.bottle*.tar.gz --clobber

      - name: Tap local repo
        run: |
          tap_dir="$(brew --repository)/Library/Taps/tkjaer/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sf "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Update formula with bottle block
        run: brew bottle --merge --write --no-commit *.bottle.json

      - name: Open bottle update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.formula.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/etr.rb
          if git diff --cached --quiet; then
            echo "Bottle metadata is already up to date."
            exit 0
          fi
          branch="bottles/etr-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "Update bottles for etr ${VERSION} [bottles]"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update bottles for etr ${VERSION} [bottles]" \
            --body "Automated bottle metadata for etr ${VERSION}. Review the formula changes before merging. Keep [bottles] in the merge commit message to avoid rebuilding bottles."
